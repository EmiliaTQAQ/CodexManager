<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex 前端 · 主界面 Demo</title>
<style>
  :root{
    --accent:#0A84FF; --ok:#34C759; --text:#1d1d1f; --muted:#86868b;
    --border:#e3e3e8; --rail:#f5f5f7; --chat:#fafafc; --card:#fff;
    --code-bg:#0f1115; --code-text:#e6e6e6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;
       color:var(--text); height:100vh; overflow:hidden; background:var(--chat); display:flex;}
  button{font-family:inherit; cursor:pointer;}

  /* ============ 顶部栏 ============ */
  .topbar{position:fixed; top:0; left:0; right:0; height:52px; display:flex; align-items:center; gap:10px;
       padding:0 14px; background:rgba(255,255,255,.96); border-bottom:1px solid var(--border); box-shadow:0 2px 12px rgba(30,50,80,.05); z-index:50;}
  .brand{display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px;}
  .logo{width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg,#0A84FF,#5E5CE6);
       display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:800;}
  .crumb{font-size:12px; color:var(--muted); background:var(--rail); padding:4px 10px; border-radius:6px;
       overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:260px;}
  .topbar .spacer{flex:1;}
  .modelchip{display:flex; align-items:center; gap:8px; border:1px solid #cfe2fa; border-radius:9px;
       padding:6px 11px; background:#f7fbff; font-size:13px; transition:background .15s,border-color .15s,box-shadow .15s;}
  .modelchip:hover{background:#eef7ff; border-color:#a8cdf7; box-shadow:0 3px 10px rgba(10,132,255,.1);}
  .modelchip .m{font-weight:600;}
  .modelchip .p{color:var(--muted);}
  .iconbtn{border:1px solid var(--border); background:#fff; width:34px; height:30px; border-radius:8px;
       display:flex; align-items:center; justify-content:center; font-size:15px; color:#555;}
  .iconbtn:hover{background:var(--rail);}

  /* ============ 左栏 ============ */
  .rail{width:236px; flex:0 0 236px; margin-top:52px; background:var(--rail); border-right:1px solid var(--border);
       display:flex; flex-direction:column; height:calc(100vh - 52px);}
  .rail-head{padding:12px; display:flex; align-items:center; gap:8px;}
  .rail-head .t{font-size:12px; font-weight:700; color:#3a3a3c; letter-spacing:.3px; flex:1;}
  .newsess{border:none; background:var(--accent); color:#fff; font-size:13px; padding:4px 12px; border-radius:7px;}
  .newsess:hover{filter:brightness(1.08);}
  .sess-list{flex:1; overflow-y:auto; padding:0 8px;}
  .sess{padding:9px 10px; border-radius:8px; cursor:pointer; margin-bottom:3px;}
  .sess:hover{background:#e9e9ee;}
  .sess.active{background:#e3edfc;}
  .sess .title{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sess .snippet{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}
  .rail-foot{padding:10px 12px; border-top:1px solid var(--border);}
  .setentry{display:flex; align-items:center; gap:9px; width:100%; border:none; background:transparent;
       border-radius:8px; padding:7px 9px; cursor:pointer; color:var(--text); font-size:13px; text-align:left;}
  .setentry:hover{background:#e9e9ee;}
  .setentry .gear{font-size:16px; color:#555; width:24px; text-align:center; flex:0 0 24px;}
  .setentry .st{font-weight:600;}
  .setentry .cap{color:var(--muted); font-size:11px; display:block; margin-top:1px; font-weight:400;}

  /* ============ 中栏对话 ============ */
  .chat{margin-top:52px; flex:1; display:flex; flex-direction:column; min-width:0;}
  .chat-head{height:44px; flex:0 0 44px; display:flex; align-items:center; padding:0 18px; gap:8px;
       border-bottom:1px solid var(--border); background:rgba(255,255,255,.86);}
  .chat-head .ttl{font-size:14px; font-weight:700;}
  .chat-head .tag{font-size:10.5px; background:rgba(10,132,255,.1); color:var(--accent); padding:2px 7px; border-radius:5px;}
  .chat-head .spacer{flex:1;}
  .msgs{flex:1; overflow-y:auto; padding:24px 26px 8px; scroll-behavior:smooth;}
  .msgs-inner{max-width:820px; margin:0 auto;}
  .msgs,.msgs-inner,.msg,.body,.bubble,.step-body,.term,.diff,.diff pre,.step-title{
       -webkit-user-select:text; user-select:text;}
  .empty-state{padding:72px 24px; text-align:center; color:var(--muted); font-size:14px;}

  .msg{display:flex; gap:12px; margin-bottom:22px; align-items:flex-start;}
  .msg.user-msg{flex-direction:row-reverse; margin-bottom:18px;}
  .avatar{width:30px; height:30px; border-radius:8px; flex:0 0 30px; display:flex; align-items:center;
       justify-content:center; font-size:14px; font-weight:700; color:#fff;}
  .avatar.user{background:#707078; border-radius:50%; font-size:12px;}
  .avatar.agent{background:linear-gradient(135deg,#0A84FF,#5E5CE6);}
  .body{flex:1; min-width:0;}
  .msg:not(.user-msg) .body{max-width:90%;}
  .msg.user-msg .body{display:flex; justify-content:flex-end;}
  .bubble{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 16px; font-size:14px; line-height:1.7;}
  .bubble:not(.user){position:relative; padding-right:58px;}
  .bubble.user{max-width:78%; background:#0A84FF; border-color:#0A84FF; color:#fff; border-radius:14px 14px 4px 14px; box-shadow:0 4px 12px rgba(10,132,255,.14);}
  .bubble.error{background:#fff4f2; border-color:#ffb8ae; color:#9f2d20;}
  .msgtext{white-space:pre-wrap; word-break:break-word;}
  .msgtext .caret{display:inline-block; width:7px; height:16px; background:var(--accent); vertical-align:-2px; animation:blink .9s infinite;}
  @keyframes blink{50%{opacity:0;}}
  .waiting-status{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; padding:4px 2px 10px;}
  .waiting-spinner{width:12px; height:12px; border:2px solid #d9e8fb; border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; flex:0 0 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* 步骤卡片 */
  .step{border:1px solid var(--border); border-radius:10px; margin:10px 0; overflow:hidden; background:var(--card);}
  .msg:not(.user-msg) .step{margin-left:0;}
  .step-head{display:flex; align-items:center; gap:8px; padding:8px 12px; cursor:pointer; user-select:none;}
  .step-head:hover{background:#f6f6f8;}
  .step-ico{width:20px; height:20px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; flex:0 0 20px;}
  .ico-cmd{background:#5E5CE6;} .ico-edit{background:#34C759;} .ico-think{background:#8e8e93;}
  .step-title{font-size:12.5px; font-weight:600; flex:1; font-family:ui-monospace,Menlo,monospace;}
  .step-sub{font-size:11px; color:var(--muted);}
  .chev{color:var(--muted); transition:transform .15s;}
  .step.open .chev{transform:rotate(90deg);}
  .step-body{display:none; border-top:1px solid var(--border); background:var(--code-bg);}
  .step.open .step-body{display:block;}
  .term{padding:10px 14px; color:var(--code-text); font-family:ui-monospace,Menlo,monospace; font-size:12px; line-height:1.6; white-space:pre-wrap;}
  .term .l-green{color:#63e07e;} .term .l-dim{color:#8a8f98;} .term .l-red{color:#ff7b72;}
  .diff{margin:10px 14px; background:#0b0e13; border-radius:8px; overflow:hidden; font-family:ui-monospace,Menlo,monospace; font-size:12px;}
  .diff .df-head{background:#1c2128; color:#8a8f98; padding:6px 12px; font-size:11px;}
  .diff pre{margin:0; padding:8px 12px; line-height:1.5;}
  .diff .add{color:#7ee787;} .diff .del{color:#ff7b72;} .diff .ctx{color:#8a8f98;}
  .copybtn{border:1px solid var(--border); background:rgba(255,255,255,.92); color:#5d5d65; border-radius:6px;
       padding:3px 7px; font-size:11px; line-height:1.2; cursor:pointer; opacity:.72; transition:opacity .15s, background .15s;
       -webkit-user-select:none; user-select:none;}
  .bubble:hover .copybtn,.step:hover .copybtn,.copybtn:focus{opacity:1;}
  .bubble>.copybtn{position:absolute; top:8px; right:8px;}
  .step{position:relative;}
  .step>.copybtn{position:absolute; top:6px; right:30px; z-index:2;}
  .copybtn:hover{background:#eef4ff; color:var(--accent);}

  /* 空状态 */
  .empty-state{text-align:center; padding:70px 20px; color:var(--muted);}
  .empty-state h2{font-size:20px; color:#3a3a3c; margin-bottom:6px;}
  .sugg{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:22px;}
  .sugg button{border:1px solid var(--border); background:#fff; border-radius:20px; padding:8px 14px; font-size:13px; color:#333;}
  .sugg button:hover{border-color:var(--accent); color:var(--accent);}

  /* 输入区 */
  .composer{padding:10px 26px 16px;}
  .composer-inner{max-width:820px; margin:0 auto; border:1px solid var(--border); border-radius:14px;
       background:#fff; padding:10px 12px; box-shadow:0 7px 22px rgba(30,50,80,.07); transition:border-color .15s, box-shadow .15s;}
  .composer-inner:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px rgba(10,132,255,.12);}
  textarea{width:100%; border:none; outline:none; resize:none; font-family:inherit; font-size:14px; line-height:1.6; min-height:22px; max-height:180px;}
  .composer-bar{display:flex; align-items:center; gap:8px; margin-top:6px;}
  .mini{font-size:12px; color:var(--muted);}
  .spacer{flex:1;}
  .sendbtn{border:none; background:var(--accent); color:#fff; border-radius:8px; padding:7px 16px; font-size:13px; box-shadow:0 4px 10px rgba(10,132,255,.18); transition:filter .15s,transform .15s;}
  .sendbtn:hover:not(:disabled){filter:brightness(1.06); transform:translateY(-1px);}
  .sendbtn:disabled{opacity:.5; cursor:not-allowed;}
  .stopbtn{border:none; background:#e9e9ee; color:#555; border-radius:8px; padding:6px 16px; font-size:13px; display:none;}

  /* 模型切换 popover */
  .pop{position:absolute; right:120px; top:52px; width:330px; background:#fff; border:1px solid var(--border);
       border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.15); padding:10px; z-index:100; display:none;}
  .pop h4{font-size:11px; color:var(--muted); margin:8px 8px 4px; letter-spacing:.3px;}
  .pop .prov{font-size:12px; font-weight:700; padding:4px 8px 2px; color:#3a3a3c;}
  .mopt{display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:8px; cursor:pointer; font-size:13px;}
  .mopt:hover{background:#f0f2f6;}
  .mopt.on{background:#e3edfc;}
  .mopt .ck{width:14px;height:14px;border-radius:50%;border:1.5px solid #b8b8c0;}
  .mopt.on .ck{border-color:var(--accent); background:radial-gradient(circle at center,var(--accent) 0 3px,#fff 4px);}
  .pop-foot{border-top:1px solid var(--border); margin-top:8px; padding:8px; display:flex; justify-content:center;}
  .pop-foot button{border:none; background:none; color:var(--accent); font-size:12.5px;}

  /* 工作区目录 popover */
  .workspace-pop{position:absolute; left:14px; top:52px; width:360px; background:#fff; border:1px solid var(--border);
       border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.15); padding:12px; z-index:110; display:none;}
  .workspace-pop.show{display:block;}
  .workspace-title{font-size:11px; color:var(--muted); margin:2px 6px 8px; letter-spacing:.3px;}
  .workspace-primary{font-size:12px; font-family:ui-monospace,Menlo,monospace; line-height:1.45; word-break:break-all;
       background:var(--rail); border-radius:7px; padding:8px; margin-bottom:10px;}
  .workspace-actions{display:flex; gap:7px; flex-wrap:wrap;}
  .workspace-actions button{border:1px solid var(--border); background:#fff; border-radius:7px; padding:6px 9px; font-size:12px; color:#333;}
  .workspace-actions button:hover{border-color:var(--accent); color:var(--accent);}
  .workspace-roots{border-top:1px solid var(--border); margin-top:10px; padding-top:8px;}
  .workspace-root{display:flex; align-items:center; gap:7px; padding:5px 3px; font-size:11px;}
  .workspace-root span{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:ui-monospace,Menlo,monospace;}
  .workspace-root button{border:none; background:transparent; color:var(--muted); font-size:13px; padding:2px 5px;}
  .workspace-root button:hover{color:#c62828;}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#d2d2d7;border-radius:6px;border:2px solid transparent;background-clip:content-box;}

  /* 设置浮层 */
  .overlay{position:fixed; inset:0; background:rgba(22,22,26,.42); z-index:300; padding:14px;
       display:none; align-items:center; justify-content:center; backdrop-filter:blur(2px);}
  .overlay.show{display:flex;}
  .overlay-bar{width:min(700px,100%); display:flex; align-items:center; gap:10px; background:#fff;
       border:1px solid var(--border); border-radius:10px 10px 0 0; padding:8px 12px;}
  .overlay-bar .ot{font-size:13px; font-weight:700; flex:1;}
  .overlay-bar .mini{font-size:11.5px; color:var(--muted);}
  .overlay-bar button{border:none; background:var(--accent); color:#fff; border-radius:7px;
       padding:5px 16px; font-size:13px; cursor:pointer;}
  .overlay-bar button:hover{filter:brightness(1.08);}
  .overlay iframe{width:min(700px,100%); height:min(520px,calc(100vh - 76px)); border:1px solid var(--border);
       border-top:none; border-radius:0 0 10px 10px; background:#f5f5f7;}

  @media (max-width:560px){
    .msgs{padding:18px 14px 8px;}
    .msg{gap:8px; margin-bottom:18px;}
    .avatar{width:28px; height:28px; flex-basis:28px;}
    .msg:not(.user-msg) .body{max-width:calc(100% - 36px);}
    .bubble{padding:10px 13px;}
    .bubble.user{max-width:88%;}
    .composer{padding:8px 12px 12px;}
  }

</style>
</head>
<body>

<!-- 顶部栏 -->
<div class="topbar">
  <div class="brand"><div class="logo">C</div> Codex 前端</div>
  <button class="crumb" id="workspaceBtn" title="管理 Codex 可访问的工作区目录">~/Downloads/Codex`s bro</button>
  <div class="spacer"></div>
  <button class="modelchip" id="modelChip" title="切换模型">
    <span style="color:var(--ok)">●</span>
    <span class="m" id="chipModel">gpt-5.6-sol</span>
    <span class="p" id="chipProvider">@ apex_gpt</span>
    <span style="color:var(--muted)">▾</span>
  </button>
  <button class="iconbtn" id="btnSettings" title="模型 / Provider 设置">⚙</button>
</div>

<!-- 模型切换 popover -->
<div class="pop" id="modelPop">
  <h4>选择模型</h4>
  <div id="popProv1" style="color:var(--muted)">—</div>
  <div id="popModels1"></div>
  <div id="popProv2" style="color:var(--muted)">—</div>
  <div id="popModels2"></div>
  <div class="pop-foot"><button id="popSettings">⚙ 设置 API Key</button></div>
</div>

<div class="workspace-pop" id="workspacePop">
  <div class="workspace-title">Codex 工作区</div>
  <div class="workspace-primary" id="workspacePrimary">—</div>
  <div class="workspace-actions">
    <button id="btnChooseWorkspace">选择主目录</button>
    <button id="btnAddWorkspace">添加目录</button>
    <button id="btnAddDesktop">添加桌面</button>
  </div>
  <div class="workspace-roots" id="workspaceRoots"></div>
</div>

<!-- 左栏 -->
<div class="rail">
  <div class="rail-head">
    <span class="t">会话</span>
    <button class="newsess" id="btnNewSess">+ 新会话</button>
  </div>
  <div class="sess-list" id="sessList"></div>
  <div class="rail-foot">
    <button class="setentry" id="btnRailSettings" title="打开模型设置">
      <span class="gear">⚙</span>
      <span class="st">模型设置<small class="cap">选择模型与 API Key</small></span>
    </button>
  </div>
</div>

<!-- 中栏对话 -->
<div class="chat">
  <div class="chat-head">
    <span class="ttl" id="sessTitle">帮我写一个 git hook</span>
    <span class="tag">主 Agent</span>
    <div class="spacer"></div>
    <span class="mini" id="connectionStatus" style="color:var(--muted)">浏览器预览 · 模拟回复</span>
  </div>
  <div class="msgs" id="msgs">
    <div class="msgs-inner" id="msgsInner"></div>
  </div>
  <div class="composer">
    <div class="composer-inner">
      <textarea id="input" placeholder="给 Codex 发消息…"></textarea>
      <div class="composer-bar">
        <span class="mini">Enter 发送 · Shift+Enter 换行</span>
        <div class="spacer"></div>
        <button class="stopbtn" id="btnStop">■ 停止</button>
        <button class="sendbtn" id="btnSend">发送</button>
      </div>
    </div>
  </div>
</div>


<!-- 设置浮层（内嵌设置页 demo.html） -->
<div class="overlay" id="settingsOverlay">
  <div class="overlay-bar">
    <span class="ot">⚙ 模型设置</span>
    <span class="mini">选择模型并输入 API Key</span>
    <button id="ovClose">✓ 完成</button>
  </div>
  <iframe id="ovFrame" src="demo.html"></iframe>
</div>

<script>
/* ================= 模拟状态 ================= */
let state = {
  provider:'apex_gpt', model:'gpt-5.6-sol',
  session:'s1', busy:false, switching:false, stopFlag:false, native:false, nativeShell:location.hash==='#native', chatJob:null,
  workspace:'', workspaceRoots:[], desktop:'',
};
const sessions = {
  s1:{ title:'新会话', snippet:'等待第一条消息…', msgs:null, history:[], threadId:null },
  s2:{ title:'新会话', snippet:'等待第一条消息…', msgs:null, history:[], threadId:null },
  s3:{ title:'新会话', snippet:'等待第一条消息…', msgs:null, history:[], threadId:null },
};

/* 可切换的模型目录；直接打开 HTML 时使用回退数据 */
let catalog = {
  apex_gpt:{ name:'apex_gpt', models:[{slug:'gpt-5.6-sol',meta:'128K · high'},{slug:'gpt-5.4',meta:'128K · high'},{slug:'gpt-5.5',meta:'128K · high'},{slug:'gpt-5.4-mini',meta:'128K · low'}] },
  deepseek:{ name:'deepseek', models:[{slug:'deepseek-v4-flash',meta:'1048K · high'}] },
  apex_resp:{ name:'apex_resp(旧)', models:[{slug:'gpt-5.6-luna',meta:'128K · high'}] },
};

/* ================= DOM 工具 ================= */
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function nativeApi(){ return window.pywebview && window.pywebview.api ? window.pywebview.api : null; }
function errorText(error){ return error && error.message ? error.message : String(error || '操作失败'); }
function displayPath(path){ return String(path || '').replace(/^\/Users\/[^/]+/, '~'); }

/* ================= 会话列表 ================= */
function renderSessions(){
  $('#sessList').innerHTML = Object.keys(sessions).map(id=>{
    const s=sessions[id]; const a = id===state.session?' active':'';
    return `<div class="sess${a}" data-id="${id}"><div class="title">${esc(s.title)}</div><div class="snippet">${esc(s.snippet)}</div></div>`;
  }).join('');
  [...document.querySelectorAll('.sess')].forEach(el=>{
    el.onclick=()=>{ if(state.busy) return; sessions[state.session].msgs = currentThread();
      state.session=el.dataset.id; renderSessions(); loadSession(); };
  });
}
$('#btnNewSess').onclick=()=>{ if(state.busy) return;
  sessions[state.session].msgs = currentThread();
  const id='s'+Date.now(); sessions[id]={title:'新会话',snippet:'等待第一条消息…',msgs:[],history:[],threadId:null};
  state.session=id; renderSessions(); loadSession(); $('#input').focus();
};

/* 每个会话自己存一份消息快照 */
function currentThread(){
  return [...document.querySelectorAll('#msgsInner > .msg')].map(n=>n.outerHTML);
}

/* ================= 首屏消息 ================= */
const seedMsgs = `
  <div class="msg user-msg"><div class="avatar user">我</div><div class="body"><div class="bubble user msgtext">给我在仓库里加一个 pre-commit hook，commit 前自动跑一遍 eslint 和单元测试，失败就阻止提交。</div></div></div>
  <div class="msg"><div class="avatar agent">C</div><div class="body">
    <div class="bubble msgtext">我来实现。先看下仓库现状和是否已有 hooks：</div>
    <div class="step open">
      <div class="step-head"><div class="step-ico ico-cmd">▸</div><div class="step-title">ls -la .git/hooks &amp;&amp; cat package.json | grep -E "scripts|devDependencies"</div><div class="chev">▶</div></div>
      <div class="step-body"><div class="term"><span class="l-green">$</span> ls -la .git/hooks
total 0
<span class="l-dim"># 未发现任何已启用的 hook 文件</span>
<span class="l-green">$</span> cat package.json | grep -A6 scripts
"scripts": { "lint": "eslint .", "test": "vitest run" }

/* ================= 加载会话 ================= */
function loadSession(){
  const s=sessions[state.session];
  $('#sessTitle').textContent=s.title;
  const empty = '<div class="empty-state">输入任务，让 Codex 开始工作。</div>';
  $('#msgsInner').innerHTML = (s.msgs && s.msgs.length) ? s.msgs.join('') : (state.native ? empty : seedMsgs);
  $('#msgs').scrollTop=$('#msgs').scrollHeight;
}

/* ================= 模型切换 popover ================= */
function renderPop(){
  $('#chipModel').textContent=state.model;
  $('#chipProvider').textContent='@ '+state.provider;
  const current = catalog[state.provider] || {name:state.provider || '暂无 Provider', models:[]};
  $('#popProv1').textContent = current.name;
  $('#popModels1').innerHTML = current.models.map(m=>`
    <div class="mopt ${m.slug===state.model?'on':''}" data-p="${state.provider}" data-m="${m.slug}">
      <div class="ck"></div><span style="flex:1">${esc(m.slug)}</span><span class="mini">${esc(m.meta)}</span>
    </div>`).join('');
  const other = Object.keys(catalog).filter(p=>p!==state.provider);
  $('#popProv2').textContent = other.map(p=>catalog[p].name).join(' · ') || '其他 Provider';
  $('#popModels2').innerHTML = other.map(p=>catalog[p].models.map(m=>`
    <div class="mopt" data-p="${p}" data-m="${m.slug}"><div class="ck"></div>
      <span style="flex:1">${esc(m.slug)}</span><span class="mini">via ${esc(catalog[p].name)}</span></div>`).join('')).join('');
}
function bindPop(){
  renderPop();
  [...document.querySelectorAll('.mopt')].forEach(el=>{
    el.onclick=async ()=>{
      if(state.switching) return;
      const provider=el.dataset.p, model=el.dataset.m, api=nativeApi();
      closePop();
      if(!api){ state.provider=provider; state.model=model; renderPop(); toastPop('已切换 → '+state.model+' @ '+state.provider); return; }
      state.switching=true;
      toastPop('正在切换并验证…');
      try{
        const result=await api.activate_provider(provider, model);
        if(result.status!=='succeeded') throw new Error(result.error || '切换失败，配置已回滚');
        state.provider=provider; state.model=model; renderPop(); toastPop('已切换 → '+state.model+' @ '+state.provider);
      }catch(error){ toastPop(errorText(error)); }
      finally{ state.switching=false; }
    };
  });
}
$('#modelChip').onclick=e=>{ e.stopPropagation(); togglePop(); };
$('#workspaceBtn').onclick=e=>{ e.stopPropagation(); $('#workspacePop').classList.toggle('show'); if($('#workspacePop').classList.contains('show')) renderWorkspace(); };
function openSettings(){ $('#settingsOverlay').classList.add('show'); }
function closeSettings(){ $('#settingsOverlay').classList.remove('show'); loadNativeState(); }
$('#btnSettings').onclick=openSettings;
$('#btnRailSettings').onclick=openSettings;
$('#popSettings').onclick=openSettings;
$('#ovClose').onclick=closeSettings;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSettings(); });
document.addEventListener('click',e=>{
  if(!$('#modelPop').contains(e.target) && e.target.id!=='modelChip') closePop();
  if(!$('#workspacePop').contains(e.target) && e.target.id!=='workspaceBtn') $('#workspacePop').classList.remove('show');
});
function togglePop(){ $('#modelPop').style.display = $('#modelPop').style.display==='block'?'none':'block'; if($('#modelPop').style.display==='block') bindPop(); }
function closePop(){ $('#modelPop').style.display='none'; }
function toastPop(m){ const d=document.createElement('div'); d.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;z-index:200;opacity:0;transition:.2s'; d.textContent=m; document.body.appendChild(d); requestAnimationFrame(()=>d.style.opacity=1); setTimeout(()=>{d.style.opacity=0; setTimeout(()=>d.remove(),220);},2000); }

function renderWorkspace(){
  $('#workspacePrimary').textContent=displayPath(state.workspace) || '未连接';
  $('#workspaceBtn').textContent=displayPath(state.workspace) || '选择工作区';
  $('#workspaceRoots').innerHTML=(state.workspaceRoots || []).map((path,index)=>`
    <div class="workspace-root"><span title="${esc(path)}">${esc(displayPath(path))}</span>
      ${index ? `<button class="remove-root" data-path="${esc(path)}" title="移除目录">×</button>` : ''}
    </div>`).join('');
  [...document.querySelectorAll('.remove-root')].forEach(button=>button.onclick=async e=>{
    e.stopPropagation(); const api=nativeApi(); if(!api) return;
    try{ const data=await api.remove_workspace_root(button.dataset.path); applyWorkspace(data); toastPop('已移除目录；新会话会使用新权限'); }
    catch(error){ toastPop(errorText(error)); }
  });
}
function applyWorkspace(data){
  if(!data) return;
  state.workspace=data.workspace || state.workspace;
  state.workspaceRoots=data.workspace_roots || state.workspaceRoots;
  state.desktop=data.desktop || state.desktop;
  sessions[state.session].threadId=null;
  renderWorkspace();
}
async function chooseWorkspace(mode){
  const api=nativeApi(); if(!api) return toastPop('浏览器预览不支持目录授权');
  try{
    const data=mode==='primary' ? await api.choose_workspace() : await api.choose_workspace_root();
    if(data){ applyWorkspace(data); toastPop('目录已更新；当前会话下一条消息使用新目录'); }
  }catch(error){ toastPop(errorText(error)); }
}
$('#btnChooseWorkspace').onclick=()=>chooseWorkspace('primary');
$('#btnAddWorkspace').onclick=()=>chooseWorkspace('root');
$('#btnAddDesktop').onclick=async()=>{
  const api=nativeApi(); if(!api) return toastPop('浏览器预览不支持目录授权');
  try{ const data=await api.add_desktop_workspace_root(); applyWorkspace(data); toastPop('桌面已加入可访问目录'); }
  catch(error){ toastPop(errorText(error)); }
};

async function loadNativeState(){
  const api=nativeApi();
  if(!api){
    if(state.nativeShell) setTimeout(loadNativeState, 300);
    return;
  }
  try{
    state.native=true;
    const data=await api.bootstrap();
    state.provider=data.status.provider_id || state.provider;
    state.model=data.status.model || state.model;
    applyWorkspace(data);
    catalog={};
    (data.providers || []).forEach(provider=>{
      const bySlug={};
      (provider.model_catalog || []).forEach(model=>{ bySlug[model.slug]=model; });
      catalog[provider.id]={
        name:provider.name,
        models:(provider.enabled_models || []).map(slug=>{
          const model=bySlug[slug] || {slug};
          const context=model.context_window ? String(model.context_window) : '';
          const reason=model.default_reasoning_level || '';
          return {slug, meta:[context,reason].filter(Boolean).join(' · ')};
        })
      };
    });
    renderPop();
    $('#modelChip').title='当前模型 · 来自本地 Codex 配置';
    $('#connectionStatus').textContent='Codex CLI · 已连接';
    loadSession();
  }catch(error){
    state.native=false;
    $('#connectionStatus').textContent='本地桥接失败';
    toastPop('读取本地配置失败：'+errorText(error));
  }
}

/* ================= 模拟对话引擎 ================= */
const mockReply = [
  {type:'cmd', title:'cat src/main.ts | head -20', lines:['import { run } from "./core";','…']},
  {type:'edit', title:'修改 src/main.ts（+12 −3）', diff:'src/main.ts'},
  {type:'text', content:'搞定 ✅ 我做了三件事：1) 加了参数校验 2) 把错误处理统一成 try/catch 3) 补了对应测试。\n\n要不要我再跑一遍完整测试确认？'},
];
const mockDiff = [
  {del:'    if (!input) throw new Error("no input");', add:'    if (!input || !input.trim()) {'},
  {del:'', add:'      throw new Error("input 不能为空");'},
  {del:'', add:'    }'},
  {ctx:'    return run(input);'},
];

function userBubble(text){
  return `<div class="msg user-msg"><div class="avatar user">我</div><div class="body"><div class="bubble user msgtext">${esc(text)}</div></div></div>`;
}
function agentShell(){
  const el=document.createElement('div'); el.className='msg';
  el.innerHTML=`<div class="avatar agent">C</div><div class="body"></div>`;
  $('#msgsInner').appendChild(el); scroll(); return el.querySelector('.body');
}
function appendError(body, message){
  const bubble=document.createElement('div'); bubble.className='bubble error msgtext';
  bubble.textContent=message; body.appendChild(bubble); scroll();
}
function showWaitingStatus(body){
  if(body.querySelector('.waiting-status')) return;
  const status=document.createElement('div'); status.className='waiting-status'; status.setAttribute('role','status');
  status.innerHTML='<span class="waiting-spinner" aria-hidden="true"></span><span>正在执行…</span>';
  body.prepend(status); scroll();
}
function hideWaitingStatus(body){
  const status=body.querySelector('.waiting-status');
  if(status) status.parentNode.removeChild(status);
}
function setAgentText(body, text){
  let bubble=body.querySelector('.live-answer');
  if(!bubble){
    bubble=document.createElement('div'); bubble.className='bubble msgtext live-answer';
    bubble.innerHTML='<span class="answer-content"></span>';
    body.appendChild(bubble); decorateCopyButtons(body);
  }
  bubble.querySelector('.answer-content').textContent=text; scroll();
}
function eventLabel(event){
  const item=event && event.item;
  if(event && event.type==='item.started' && item && item.type==='command_execution') return item.command || '执行工作区命令';
  if(event && event.type==='log') return event.text || 'Codex 输出';
  return '';
}
function appendNativeEvents(body, events, rendered){
  events.slice(rendered).forEach(event=>{
    if(event.type==='agent_message_delta' || event.type==='turn.started' || event.type==='turn.completed' || event.type==='item.completed') return;
    if(event.type==='command_execution_output_delta'){
      const id=event.itemId || '';
      let card=id ? body.querySelector(`[data-item-id="${CSS.escape(id)}"]`) : null;
      if(!card){
        card=document.createElement('div'); card.className='step open'; if(id) card.dataset.itemId=id;
        card.innerHTML=buildStep({type:'cmd', title:'执行工作区命令', lines:[]}); body.appendChild(card);
      }
      const term=card.querySelector('.term'); if(term) term.textContent+=(event.delta || '');
      return;
    }
    if(event.item && event.item.type==='reasoning') return;
    const label=eventLabel(event);
    if(!label) return;
    const item=event.item || {};
    if(item.type!=='command_execution') return;
    const card=document.createElement('div'); card.className='step open';
    if(item.id) card.dataset.itemId=item.id;
    card.innerHTML=buildStep({type:'cmd', title:label, lines:item.command_output ? [item.command_output] : []});
    body.appendChild(card);
  });
  decorateCopyButtons(body);
  if(events.length>rendered) scroll();
  return events.length;
}
async function sendNativeMessage(api, text, body, session){
  const started=await api.start_chat(text, null, session.threadId || null);
  session.threadId=started.thread_id || session.threadId;
  state.chatJob=started.job_id;
  showWaitingStatus(body);
  let eventCursor=0;
  let answerCursor=0;
  let answer='';
  try{
    while(state.chatJob){
      const result=await api.poll_chat(state.chatJob, eventCursor, answerCursor);
      if(result.thread_id) session.threadId=result.thread_id;
      eventCursor=Number(result.next_event_cursor || eventCursor);
      answerCursor=Number(result.next_answer_cursor || answerCursor);
      appendNativeEvents(body, result.events || [], 0);
      if(result.answer_delta){ answer+=result.answer_delta; setAgentText(body, answer); }
      if(result.done){
        state.chatJob=null;
        if(result.error) appendError(body, result.error);
        if(answer) session.history.push({role:'assistant', content:answer});
        return;
      }
      await sleep(100);
    }
  }finally{
    hideWaitingStatus(body);
  }
}
async function sendMockMessage(body){
  for(let i=0;i<mockReply.length;i++){
    if(state.stopFlag) break;
    const step=mockReply[i];
    if(step.type==='text'){
      const b=document.createElement('div'); b.className='bubble msgtext'; body.appendChild(b);
      let j=0; const full=step.content;
      while(j<full.length && !state.stopFlag){ b.textContent=full.slice(0,++j); b.innerHTML+='<span class="caret"></span>'; b.lastChild.remove(); scroll(); await sleep(14); }
      b.textContent=full;
      decorateCopyButtons(body);
    }else{
      const card=document.createElement('div'); card.className='step'; card.innerHTML=buildStep(step); body.appendChild(card); scroll();
      await sleep(step.type==='think'?700:1100);
      card.classList.add('open');
      const term=card.querySelector('.term');
      if(term){ const lines=(step.lines||[]).map((l,idx)=>`<span class="${idx%2?'l-dim':'l-green'}">$</span> ${esc(l)}`); term.innerHTML=''; for(const ln of lines){ if(state.stopFlag)break; term.innerHTML+=ln+'\n'; scroll(); await sleep(220);} }
      scroll();
    }
  }
}
async function sendMessage(text){
  if(state.busy) return; state.busy=true; state.stopFlag=false;
  $('#btnSend').disabled=true; $('#btnStop').style.display='block'; $('#btnNewSess').disabled=true;
  const sess=sessions[state.session];
  if(sess.title==='新会话'){ sess.title = text.length>16? text.slice(0,16)+'…':text; sess.snippet=text.slice(0,20); }
  sess.history=sess.history || [];
  sess.history.push({role:'user', content:text});
  renderSessions(); $('#sessTitle').textContent=sess.title;
  // 用户消息
  const uw=document.createElement('div'); uw.className='msg user-msg';
  uw.innerHTML=`<div class="avatar user">我</div><div class="body"><div class="bubble user msgtext">${esc(text)}</div></div>`;
  $('#msgsInner').appendChild(uw); scroll();
  const body=agentShell();
  try{
    const api=nativeApi();
    if(api) await sendNativeMessage(api, text, body, sess);
    else if(state.nativeShell) appendError(body, 'Codex 桥接尚未就绪，请稍候再发送。');
    else await sendMockMessage(body);
  }catch(error){ appendError(body, errorText(error)); }
  state.busy=false; $('#btnSend').disabled=false; $('#btnStop').style.display='none'; $('#btnNewSess').disabled=false;
  sessions[state.session].msgs = currentThread(); renderSessions(); scroll();
}
function buildStep(s){
  const chev = '<span class="chev">▶</span>';
  if(s.type==='cmd') return `<div class="step-head"><div class="step-ico ico-cmd">▸</div><div class="step-title">${esc(s.title)}</div>${chev}</div><div class="step-body"><div class="term"></div></div>`;
  if(s.type==='think') return `<div class="step-head"><div class="step-ico ico-think">◌</div><div class="step-title">${esc(s.title)}</div>${chev}</div><div class="step-body"><div class="term"></div></div>`;
  if(s.type==='edit') return `<div class="step-head"><div class="step-ico ico-edit">✎</div><div class="step-title">修改 ${esc(s.diff)}</div>${chev}</div><div class="step-body"><div class="diff"><div class="df-head">${esc(s.diff)} · 待审阅</div><pre>${mockDiff.map(d=>`${d.del?'<span class="del">- '+esc(d.del)+'</span>':''}${d.add?'<span class="add">+ '+esc(d.add)+'</span>':''}${(!d.del&&!d.add)?'<span class="ctx"> '+esc(d.ctx)+'</span>':''}`).join('\n')}</pre></div></div>`;
  return '';
}
async function copyText(text, button){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
    else{
      const area=document.createElement('textarea'); area.value=text; area.style.position='fixed'; area.style.opacity='0';
      document.body.appendChild(area); area.focus(); area.select(); document.execCommand('copy'); area.remove();
    }
    if(button){ const previous=button.textContent; button.textContent='已复制'; setTimeout(()=>button.textContent=previous,1200); }
  }catch(error){ toastPop('复制失败：'+errorText(error)); }
}
function copySource(element){
  const clone=element.cloneNode(true);
  clone.querySelectorAll('.copybtn').forEach(button=>button.remove());
  return clone.textContent || '';
}
function decorateCopyButtons(root){
  if(!root) return;
  root.querySelectorAll('.bubble.msgtext:not(.user):not(.error), .step').forEach(element=>{
    if(element.querySelector(':scope > .copybtn')) return;
    const button=document.createElement('button'); button.className='copybtn'; button.type='button'; button.textContent='复制';
    button.title='复制内容';
    button.onclick=event=>{ event.stopPropagation(); copyText(copySource(element).trim(), button); };
    element.appendChild(button);
  });
}
function scroll(){ $('#msgs').scrollTop=$('#msgs').scrollHeight; }
// 步骤点击折叠
$('#msgsInner').addEventListener('click',e=>{
  if(e.target.closest('.copybtn')) return;
  const h=e.target.closest('.step-head'); if(h){ const st=h.parentElement; st.classList.toggle('open'); }
});

/* ================= 发送事件 ================= */
$('#btnSend').onclick=()=>submit();
$('#btnStop').onclick=async()=>{ state.stopFlag=true; const api=nativeApi();
  if(api && state.chatJob){ try{ await api.stop_chat(state.chatJob); }catch(error){ appendError($('#msgsInner .msg:last-child .body'), errorText(error)); } }
};
$('#input').addEventListener('keydown',e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); submit(); }
});
document.addEventListener('keydown',e=>{
  if(e.metaKey && !e.shiftKey && !e.ctrlKey && !e.altKey && String(e.key).toLowerCase()==='m'){
    const api=nativeApi();
    if(api && api.minimize_window){ e.preventDefault(); api.minimize_window(); }
  }
});
function submit(){
  const v=$('#input').value.trim(); if(!v||state.busy) return;
  $('#input').value=''; $('#input').style.height='auto'; sendMessage(v);
}
$('#input').addEventListener('input',function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,180)+'px'; });

/* ================= 启动 ================= */
renderSessions(); loadSession(); renderPop(); decorateCopyButtons($('#msgsInner'));
$('#input').focus();
loadNativeState();
window.addEventListener('pywebviewready', loadNativeState);
</script>
