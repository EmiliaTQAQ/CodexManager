<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex 模型设置</title>
<style>
  :root{
    --accent:#0A84FF; --accent-soft:#eaf4ff; --ok:#34C759; --err:#FF3B30;
    --bg:#f4f6fa; --panel:#fff; --border:#e0e4eb; --text:#1d1d1f; --muted:#7b8492;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;
       background:linear-gradient(135deg,#f5f8fd 0%,#f1f3f7 100%); color:var(--text); min-height:100%; padding:16px 20px;}
  button,input,select{font:inherit;}
  button{cursor:pointer;}
  button:disabled{cursor:not-allowed; opacity:.48;}
  .window{width:min(620px,100%); min-height:0; margin:0 auto; background:var(--panel);
       border:1px solid rgba(215,220,229,.9); border-radius:14px; box-shadow:0 18px 46px rgba(32,54,86,.12);
       display:flex; flex-direction:column; overflow:hidden;}
  .header{padding:18px 22px 15px; border-bottom:1px solid var(--border); background:rgba(255,255,255,.92);}
  .title-row{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;
       color:#fff; font-size:14px; font-weight:800; background:linear-gradient(135deg,#0A84FF,#5E5CE6);
       box-shadow:0 5px 12px rgba(10,132,255,.2);}
  .eyebrow{font-size:10px; color:var(--accent); font-weight:800; letter-spacing:.8px; margin-bottom:3px;}
  h1{font-size:21px; line-height:1.25; letter-spacing:0;}
  .connection{margin-left:auto; display:inline-flex; align-items:center; gap:5px; padding:5px 8px;
       border:1px solid #d7f0dd; border-radius:999px; color:#218b38; background:#f3fbf5; font-size:11px; white-space:nowrap;}
  .connection::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .subtitle{font-size:13px; color:var(--muted); margin-top:7px; line-height:1.55;}
  .current{display:flex; align-items:center; gap:10px; margin-top:14px; padding:10px 11px;
       background:linear-gradient(90deg,#f2f8ff,#f8fbff); border:1px solid #dcecff; border-radius:9px; font-size:13px;}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--ok); flex:0 0 8px; box-shadow:0 0 0 3px rgba(52,199,89,.13);}
  .current-copy{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .current-label{color:var(--muted); font-size:11px;}
  .current-value{font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .status-tag{margin-left:auto; padding:4px 7px; border-radius:5px; background:#e6f6eb; color:#218b38; font-size:10.5px; white-space:nowrap;}
  .form{padding:19px 22px 18px;}
  .field{margin-bottom:15px;}
  .field:last-of-type{margin-bottom:17px;}
  label{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:650; margin-bottom:8px;}
  .field-icon{width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; border-radius:5px;
       background:var(--accent-soft); color:var(--accent); font-size:11px; font-weight:800;}
  .field-meta{margin-left:auto; color:var(--muted); font-size:11px; font-weight:400;}
  select,input{display:block; width:100%; min-height:42px; border:1px solid var(--border); border-radius:9px;
       background:#fff; color:var(--text); padding:9px 12px; outline:none; transition:border-color .15s,box-shadow .15s,background .15s;}
  select:focus,input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(10,132,255,.12);}
  .key-wrap{display:flex; gap:8px; padding:4px; border:1px solid var(--border); border-radius:10px; background:#fafbfd; transition:border-color .15s,box-shadow .15s;}
  .key-wrap:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px rgba(10,132,255,.12); background:#fff;}
  .key-wrap input{border:none; background:transparent; box-shadow:none;}
  .key-wrap input:focus{box-shadow:none;}
  .key-wrap input{flex:1; min-width:0; font-family:ui-monospace,Menlo,monospace;}
  .toggle-key{border:1px solid var(--border); background:#fff; border-radius:7px; padding:0 12px; color:#4c4c50; font-size:12px;}
  .toggle-key:hover{background:#f7f7f9;}
  .hint{font-size:12px; color:var(--muted); line-height:1.55; margin-top:7px;}
  .selection-note{display:none; margin-top:8px; color:var(--muted); font-size:12px;}
  .selection-note.show{display:block;}
  .actions{display:flex; align-items:center; gap:10px;}
  .primary{flex:1; min-height:42px; border:1px solid var(--accent); border-radius:9px; background:var(--accent);
       color:#fff; font-size:14px; font-weight:650; box-shadow:0 5px 12px rgba(10,132,255,.2); transition:filter .15s,transform .15s,box-shadow .15s;}
  .primary::after{content:"  →"; font-size:16px; vertical-align:-1px;}
  .primary:hover{filter:brightness(1.06); box-shadow:0 7px 16px rgba(10,132,255,.25); transform:translateY(-1px);}
  .primary:active{transform:translateY(0);}
  .secondary{min-height:42px; border:1px solid var(--border); border-radius:9px; background:#fff; color:#4c4c50;
       padding:0 14px; transition:background .15s,border-color .15s;}
  .secondary:hover{background:#f7f7f9;}
  .activity{min-height:22px; margin-top:12px; color:var(--muted); font-size:12px; line-height:1.5; display:flex; align-items:center; gap:5px;}
  .activity.ok{color:#1f9c3a;} .activity.err{color:var(--err);}
  .empty{padding:30px 0; color:var(--muted); text-align:center; font-size:13px; line-height:1.6;}
  .spinner{display:inline-block; width:12px; height:12px; margin-right:5px; vertical-align:-2px;
       border:2px solid rgba(10,132,255,.25); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #toasts{position:fixed; top:18px; right:18px; z-index:20; display:flex; flex-direction:column; gap:8px;}
  .toast{background:#1d1d1f; color:#fff; font-size:13px; padding:10px 14px; border-radius:9px; opacity:0;
       transform:translateY(-5px); transition:.2s; box-shadow:0 6px 20px rgba(0,0,0,.2);}
  .toast.show{opacity:1; transform:none;} .toast.ok{background:#177a32;} .toast.err{background:#b5231d;}
  @media (max-width:560px){
    body{padding:12px;}
    .header,.form{padding-left:16px; padding-right:16px;}
    .actions{flex-direction:column-reverse; align-items:stretch;}
  }
</style>
</head>
<body>
<div id="toasts"></div>
<main class="window">
  <header class="header">
    <div class="title-row">
      <div class="brand-mark">C</div>
      <div><div class="eyebrow">CODEX MODEL</div><h1>切换模型</h1></div>
      <span class="connection" id="connectionPill">本地配置</span>
    </div>
    <p class="subtitle">选择要使用的模型，输入对应的 API Key，然后应用即可。</p>
    <div class="current">
      <span class="dot" id="dot"></span>
      <div class="current-copy"><span class="current-label">当前使用</span><span class="current-value" id="statusCur">读取中…</span></div>
      <span class="status-tag" id="statusTag">连接中</span>
    </div>
  </header>

  <section class="form">
    <div class="field">
      <label for="modelSelect"><span class="field-icon">◆</span>模型<span class="field-meta">选择后自动识别 Provider</span></label>
      <select id="modelSelect" aria-label="选择模型"></select>
      <div class="selection-note" id="selectionNote"></div>
    </div>

    <div class="field">
      <label for="apiKey"><span class="field-icon">⌁</span>API Key<span class="field-meta">安全保存</span></label>
      <div class="key-wrap">
        <input id="apiKey" type="password" autocomplete="off" placeholder="输入所选模型对应的 API Key">
        <button class="toggle-key" id="toggleKey" type="button">显示</button>
      </div>
      <p class="hint" id="keyHint">已保存的 Key 可以留空；输入新 Key 会覆盖原来的 Key。</p>
    </div>

    <div class="actions">
      <button class="secondary" id="btnRefresh" type="button">重新读取</button>
      <button class="secondary" id="btnRollback" type="button" disabled>回滚上一份</button>
      <button class="primary" id="btnApply" type="button">应用并切换</button>
    </div>
    <div class="activity" id="activity">正在读取本地模型配置…</div>
  </section>
</main>

<script>
let providers = [
  {id:'apex_gpt', name:'apex_gpt', api_key:{configured:true, masked:'sk-e371••••••4f82'}, default_model:'gpt-5.6-sol', enabled_models:['gpt-5.6-sol','gpt-5.4','gpt-5.5','gpt-5.4-mini'], model_catalog:[
    {slug:'gpt-5.6-sol', display_name:'gpt-5.6-sol'}, {slug:'gpt-5.4', display_name:'gpt-5.4'},
    {slug:'gpt-5.5', display_name:'gpt-5.5'}, {slug:'gpt-5.4-mini', display_name:'gpt-5.4-mini'}
  ]},
  {id:'deepseek', name:'deepseek', api_key:{configured:true, masked:'sk-ds-••••••9f3a'}, default_model:'deepseek-v4-flash', enabled_models:['deepseek-v4-flash'], model_catalog:[
    {slug:'deepseek-v4-flash', display_name:'deepseek-v4-flash'}
  ]}
];
let activeId = 'apex_gpt';
let activeModel = 'gpt-5.6-sol';
let busy = false;
let hasBackup = false;

const $ = selector => document.querySelector(selector);
function nativeApi(){
  if(window.pywebview && window.pywebview.api) return window.pywebview.api;
  if(window.parent !== window && window.parent.pywebview && window.parent.pywebview.api) return window.parent.pywebview.api;
  return null;
}
function errorText(error){ return error && error.message ? error.message : String(error || '操作失败'); }
function esc(value){ return String(value).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normalizeProvider(provider){
  const next = Object.assign({}, provider);
  next.model_catalog = next.model_catalog || next.catalog || [];
  next.enabled_models = next.enabled_models || [];
  next.api_key = next.api_key && typeof next.api_key === 'object'
    ? next.api_key
    : {configured:Boolean(next.api_key), masked:next.api_key || ''};
  return next;
}
function findProvider(id){ return providers.find(provider=>provider.id===id); }
function selectedValue(providerId, model){ return providerId + '::' + model; }
function parseSelection(value){
  const separator = value.indexOf('::');
  return separator < 0 ? {providerId:'', model:''} : {providerId:value.slice(0, separator), model:value.slice(separator + 2)};
}
function modelEntries(){
  return providers.flatMap(provider=>{
    const allowed = provider.enabled_models.length ? provider.enabled_models : provider.model_catalog.map(model=>model.slug);
    const models = provider.model_catalog.filter(model=>allowed.includes(model.slug));
    return models.map(model=>({provider, model}));
  });
}
function renderModels(preferred){
  const select = $('#modelSelect');
  const entries = modelEntries();
  if(!entries.length){
    select.innerHTML = '<option value="">暂无可用模型</option>';
    select.disabled = true; $('#btnApply').disabled = true; $('#selectionNote').classList.remove('show'); return;
  }
  const groups = new Map();
  entries.forEach(({provider, model})=>{
    if(!groups.has(provider.id)) groups.set(provider.id, {provider, models:[]});
    groups.get(provider.id).models.push(model);
  });
  select.innerHTML = [...groups.values()].map(group=>`<optgroup label="${esc(group.provider.name)}">${group.models.map(model=>
    `<option value="${esc(selectedValue(group.provider.id, model.slug))}">${esc(model.display_name || model.slug)}</option>`
  ).join('')}</optgroup>`).join('');
  const value = preferred || selectedValue(activeId, activeModel);
  select.value = [...select.options].some(option=>option.value===value) ? value : select.options[0].value;
  select.disabled = false; $('#btnApply').disabled = false;
  updateSelectionHint();
}
function renderStatus(){
  const provider = findProvider(activeId);
  $('#statusCur').textContent = provider ? activeModel + ' · ' + provider.name : '尚未配置模型';
  $('#dot').style.background = provider ? 'var(--ok)' : 'var(--muted)';
  $('#statusTag').textContent = provider ? '已启用' : '未配置';
  $('#statusTag').style.background = provider ? '#e6f6eb' : '#f0f1f3';
  $('#statusTag').style.color = provider ? '#218b38' : 'var(--muted)';
}
function updateSelectionHint(){
  const selection = parseSelection($('#modelSelect').value || '');
  const provider = findProvider(selection.providerId);
  if(!provider) return;
  const isCurrent = selection.providerId===activeId && selection.model===activeModel;
  $('#selectionNote').textContent = isCurrent ? '当前正在使用此模型' : '切换后 Codex 会使用此模型';
  $('#selectionNote').classList.add('show');
  $('#keyHint').textContent = provider.api_key.configured
    ? '该模型已有已保存的 API Key；留空即可继续使用，输入新 Key 会覆盖它。'
    : '该模型尚未配置 API Key，请输入后再应用。';
}
function setActivity(message, type){ $('#activity').innerHTML = message; $('#activity').className = 'activity' + (type ? ' ' + type : ''); }
function toast(message, type){
  const item=document.createElement('div'); item.className='toast '+(type||''); item.textContent=message;
  $('#toasts').appendChild(item); requestAnimationFrame(()=>item.classList.add('show'));
  setTimeout(()=>{ item.classList.remove('show'); setTimeout(()=>item.remove(),220); },2400);
}
function replaceProvider(provider){
  const normalized=normalizeProvider(provider); const index=providers.findIndex(item=>item.id===normalized.id);
  if(index>=0) providers[index]=Object.assign(providers[index], normalized); else providers.push(normalized);
  return providers[index>=0 ? index : providers.length-1];
}
async function loadBackendState(){
  const api=nativeApi();
  if(!api){ renderModels(); renderStatus(); $('#connectionPill').textContent='预览模式'; setActivity('浏览器预览模式 · 配置不会写入本机'); return; }
  try{
    const data=await api.bootstrap();
    providers=(data.providers || []).map(normalizeProvider);
    activeId=data.status.provider_id || (providers[0] && providers[0].id) || '';
    activeModel=data.status.model || (findProvider(activeId) && findProvider(activeId).default_model) || '';
    hasBackup=Boolean(data.status.has_backup);
    renderModels(); renderStatus(); $('#connectionPill').textContent='已连接'; setActivity('已读取本地 Codex 配置');
    $('#btnRollback').disabled=!hasBackup;
  }catch(error){ $('#connectionPill').textContent='连接失败'; setActivity('读取本地配置失败：'+esc(errorText(error)), 'err'); toast(errorText(error), 'err'); }
}
async function applyModel(){
  if(busy) return;
  const selection=parseSelection($('#modelSelect').value || '');
  const provider=findProvider(selection.providerId);
  if(!provider || !selection.model){ toast('请选择一个模型', 'err'); return; }
  const key=$('#apiKey').value.trim();
  if(!key && !provider.api_key.configured){ toast('请先输入 API Key', 'err'); $('#apiKey').focus(); return; }
  busy=true; $('#btnApply').disabled=true; $('#btnRefresh').disabled=true; setActivity('<span class="spinner"></span>正在保存并验证…');
  const api=nativeApi();
  try{
    if(!api){
      if(key) provider.api_key={configured:true, masked:key.length>10 ? key.slice(0,5)+'••••••'+key.slice(-4) : '••••••'};
      activeId=provider.id; activeModel=selection.model; provider.default_model=selection.model;
      $('#apiKey').value=''; renderModels(selectedValue(activeId, activeModel)); renderStatus();
      setActivity('已切换到 '+esc(activeModel), 'ok'); toast('模型已切换', 'ok'); return;
    }
    if(key) replaceProvider(await api.set_secret(provider.id, key));
    const current=findProvider(provider.id);
    const catalog=current.model_catalog || [];
    const enabled=[...(current.enabled_models || [])];
    if(!enabled.length) catalog.forEach(model=>{ if(model.slug) enabled.push(model.slug); });
    if(!enabled.includes(selection.model)) enabled.push(selection.model);
    replaceProvider(await api.save_provider({
      id:current.id, name:current.name, base_url:current.base_url, wire_api:current.wire_api || 'responses',
      default_model:selection.model, enabled_models:[...new Set(enabled)], model_catalog:catalog
    }));
    const result=await api.activate_provider(current.id, selection.model);
    if(result.status!=='succeeded') throw new Error(result.error || '切换失败，配置已回滚');
    activeId=current.id; activeModel=selection.model; $('#apiKey').value='';
    await loadBackendState();
    setActivity('已切换到 '+esc(activeModel), 'ok'); toast('模型已切换', 'ok');
  }catch(error){ setActivity('切换失败：'+esc(errorText(error)), 'err'); toast(errorText(error), 'err'); }
  finally{ busy=false; $('#btnApply').disabled=false; $('#btnRefresh').disabled=false; }
}

$('#modelSelect').addEventListener('change', updateSelectionHint);
$('#btnApply').addEventListener('click', applyModel);
$('#btnRefresh').addEventListener('click', loadBackendState);
$('#btnRollback').addEventListener('click', async ()=>{
  if(busy || !hasBackup) return;
  busy=true; $('#btnApply').disabled=true; $('#btnRefresh').disabled=true; $('#btnRollback').disabled=true;
  setActivity('<span class="spinner"></span>正在恢复上一份配置…');
  const api=nativeApi();
  try{
    if(!api) throw new Error('浏览器预览模式不支持回滚');
    const result=await api.rollback();
    if(result.status!=='succeeded') throw new Error(result.error || '回滚失败');
    await loadBackendState();
    setActivity('已恢复上一份配置', 'ok'); toast('配置已回滚', 'ok');
  }catch(error){ setActivity('回滚失败：'+esc(errorText(error)), 'err'); toast(errorText(error), 'err'); }
  finally{ busy=false; $('#btnApply').disabled=false; $('#btnRefresh').disabled=false; $('#btnRollback').disabled=!hasBackup; }
});
$('#toggleKey').addEventListener('click', ()=>{
  const input=$('#apiKey'); const visible=input.type==='text'; input.type=visible ? 'password' : 'text'; $('#toggleKey').textContent=visible ? '显示' : '隐藏';
});
renderModels(); renderStatus();
loadBackendState();
window.addEventListener('pywebviewready', loadBackendState);
</script>
</body>
</html>
