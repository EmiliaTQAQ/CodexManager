<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101617" />
  <title>Snake // Neon Grid</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101617;
      --panel: #182022;
      --panel-2: #202a2c;
      --line: #354245;
      --muted: #8fa3a5;
      --text: #f4f7f3;
      --mint: #9cf2c5;
      --mint-strong: #44d58f;
      --coral: #ff8e72;
      --yellow: #f6cf70;
      --shadow: rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button {
      font: inherit;
    }

    .app-shell {
      min-height: 100vh;
      padding: clamp(18px, 4vw, 48px);
      display: flex;
      flex-direction: column;
    }

    .topbar {
      width: min(1180px, 100%);
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid var(--mint-strong);
      color: var(--mint);
      font-size: 20px;
      line-height: 1;
      box-shadow: 4px 4px 0 rgba(68, 213, 143, 0.16);
    }

    .brand-copy {
      display: grid;
      gap: 2px;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--mint);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mint-strong);
      box-shadow: 0 0 0 4px rgba(68, 213, 143, 0.12);
    }

    .status.is-paused,
    .status.is-over {
      color: var(--coral);
    }

    .status.is-paused .status-dot,
    .status.is-over .status-dot {
      background: var(--coral);
      box-shadow: 0 0 0 4px rgba(255, 142, 114, 0.12);
    }

    .game-layout {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: clamp(20px, 4vw, 48px);
      align-items: start;
    }

    .game-panel {
      min-width: 0;
    }

    .board-wrap {
      position: relative;
      width: min(74vh, 760px, 100%);
      max-width: 100%;
      margin: 0 auto;
      aspect-ratio: 1;
      background: #0c1112;
      border: 1px solid var(--line);
      box-shadow: 12px 12px 0 rgba(0, 0, 0, 0.13);
      touch-action: none;
      user-select: none;
    }

    .board-wrap::before,
    .board-wrap::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--mint-strong);
      pointer-events: none;
      z-index: 2;
    }

    .board-wrap::before {
      top: -1px;
      left: -1px;
      border-top: 2px solid;
      border-left: 2px solid;
    }

    .board-wrap::after {
      right: -1px;
      bottom: -1px;
      border-right: 2px solid;
      border-bottom: 2px solid;
    }

    #board {
      display: block;
      width: 100%;
      height: 100%;
    }

    .board-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(12, 17, 18, 0.76);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    .board-overlay.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-content {
      width: min(300px, 100%);
      text-align: center;
    }

    .overlay-kicker {
      margin: 0 0 10px;
      color: var(--coral);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .overlay-title {
      margin: 0;
      font-size: clamp(28px, 5vw, 48px);
      line-height: 0.98;
      letter-spacing: -0.03em;
    }

    .overlay-score {
      margin: 12px 0 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .primary-action {
      min-height: 44px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--mint-strong);
      border-radius: 4px;
      background: var(--mint-strong);
      color: #07120e;
      cursor: pointer;
      font-weight: 800;
      transition: transform 120ms ease, background 120ms ease;
    }

    .primary-action:hover {
      background: var(--mint);
      transform: translateY(-1px);
    }

    .primary-action:active {
      transform: translateY(1px);
    }

    .side-panel {
      min-width: 0;
      padding-top: 4px;
    }

    .side-heading {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .score-block {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      margin-bottom: 28px;
      border: 1px solid var(--line);
      background: var(--line);
    }

    .score-item {
      min-width: 0;
      padding: 16px;
      background: var(--panel);
    }

    .score-item--wide {
      grid-column: 1 / -1;
      background: var(--panel-2);
    }

    .score-label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .score-value {
      display: block;
      margin-top: 5px;
      color: var(--text);
      font-size: clamp(24px, 4vw, 34px);
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      line-height: 1;
    }

    .score-item--wide .score-value {
      color: var(--mint);
    }

    .control-section {
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .control-section + .control-section {
      margin-top: 24px;
    }

    .section-label {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .direction-pad {
      width: 164px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 48px);
      gap: 6px;
    }

    .control-button,
    .icon-button {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease, color 120ms ease, transform 120ms ease;
    }

    .control-button:hover,
    .icon-button:hover {
      border-color: var(--mint-strong);
      background: var(--panel-2);
      color: var(--mint);
    }

    .control-button:active,
    .icon-button:active {
      transform: scale(0.96);
    }

    .control-button {
      display: grid;
      place-items: center;
      font-size: 21px;
      line-height: 1;
    }

    .control-button[data-dir="up"] { grid-column: 2; grid-row: 1; }
    .control-button[data-dir="left"] { grid-column: 1; grid-row: 2; }
    .control-button[data-dir="down"] { grid-column: 2; grid-row: 3; }
    .control-button[data-dir="right"] { grid-column: 3; grid-row: 2; }

    .tool-row {
      display: flex;
      gap: 8px;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .key-hint {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    kbd {
      display: inline-block;
      min-width: 23px;
      padding: 2px 5px;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 3px;
      color: var(--text);
      font-size: 10px;
      line-height: 1.2;
      text-align: center;
    }

    .footer-note {
      width: min(1180px, 100%);
      margin: auto auto 0;
      padding-top: 28px;
      color: #637678;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    button:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 3px;
    }

    @media (max-width: 820px) {
      .app-shell {
        padding: 18px;
      }

      .topbar {
        margin-bottom: 18px;
      }

      .game-layout {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .side-panel {
        width: min(620px, 100%);
        margin: 0 auto;
      }

      .side-heading {
        display: none;
      }

      .score-block {
        margin-bottom: 18px;
      }

      .control-section {
        padding-top: 18px;
      }

      .control-section + .control-section {
        margin-top: 18px;
      }

      .footer-note {
        padding-top: 22px;
      }
    }

    @media (max-width: 480px) {
      .brand-subtitle {
        display: none;
      }

      .status {
        font-size: 10px;
      }

      .score-item {
        padding: 13px;
      }

      .score-value {
        font-size: 27px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div class="brand-copy">
          <div class="brand-name">Snake / Neon Grid</div>
          <div class="brand-subtitle">classic arcade loop</div>
        </div>
      </div>
      <div class="status" id="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText">running</span>
      </div>
    </header>

    <main class="game-layout">
      <section class="game-panel" aria-label="贪吃蛇游戏区域">
        <div class="board-wrap" id="boardWrap">
          <canvas id="board" aria-label="贪吃蛇棋盘"></canvas>
          <div class="board-overlay" id="boardOverlay">
            <div class="overlay-content">
              <p class="overlay-kicker" id="overlayKicker">signal lost</p>
              <h1 class="overlay-title" id="overlayTitle">游戏结束</h1>
              <p class="overlay-score" id="overlayScore">本局得分 0</p>
              <button class="primary-action" id="overlayAction" type="button">
                <span aria-hidden="true">↻</span>
                <span>重新开始</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <aside class="side-panel" aria-label="游戏数据与控制">
        <p class="side-heading">run telemetry</p>

        <section class="score-block" aria-label="分数">
          <div class="score-item score-item--wide">
            <span class="score-label">score</span>
            <strong class="score-value" id="score">0000</strong>
          </div>
          <div class="score-item">
            <span class="score-label">best</span>
            <strong class="score-value" id="best">0000</strong>
          </div>
          <div class="score-item">
            <span class="score-label">level</span>
            <strong class="score-value" id="level">01</strong>
          </div>
        </section>

        <section class="control-section" aria-label="方向控制">
          <p class="section-label">direction</p>
          <div class="direction-pad">
            <button class="control-button" data-dir="up" type="button" aria-label="向上">↑</button>
            <button class="control-button" data-dir="left" type="button" aria-label="向左">←</button>
            <button class="control-button" data-dir="down" type="button" aria-label="向下">↓</button>
            <button class="control-button" data-dir="right" type="button" aria-label="向右">→</button>
          </div>
          <p class="key-hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或方向键移动，<kbd>Space</kbd> 暂停</p>
        </section>

        <section class="control-section" aria-label="游戏操作">
          <p class="section-label">session</p>
          <div class="tool-row">
            <button class="icon-button" id="pauseBtn" type="button" aria-label="暂停游戏" title="暂停 / 继续">Ⅱ</button>
            <button class="icon-button" id="restartBtn" type="button" aria-label="重新开始" title="重新开始">↻</button>
          </div>
        </section>
      </aside>
    </main>

    <footer class="footer-note">keep the line alive // local high score</footer>
  </div>

  <script>
    (() => {
      "use strict";

      const GRID = 24;
      const START_LENGTH = 4;
      const SCORE_STEP = 10;
      const STORAGE_KEY = "snake-neon-grid-best";
      const DIRECTIONS = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };

      const canvas = document.getElementById("board");
      const boardWrap = document.getElementById("boardWrap");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const levelEl = document.getElementById("level");
      const statusEl = document.getElementById("status");
      const statusTextEl = document.getElementById("statusText");
      const overlayEl = document.getElementById("boardOverlay");
      const overlayKickerEl = document.getElementById("overlayKicker");
      const overlayTitleEl = document.getElementById("overlayTitle");
      const overlayScoreEl = document.getElementById("overlayScore");
      const overlayActionEl = document.getElementById("overlayAction");
      const pauseBtn = document.getElementById("pauseBtn");
      const restartBtn = document.getElementById("restartBtn");

      let boardSize = 0;
      let cellSize = 0;
      let dpr = 1;
      let snake = [];
      let food = null;
      let direction = { ...DIRECTIONS.right };
      let queuedDirection = { ...DIRECTIONS.right };
      let score = 0;
      let best = readBest();
      let level = 1;
      let state = "running";
      let timerId = null;
      let touchStart = null;

      function readBest() {
        try {
          return Number.parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10) || 0;
        } catch (error) {
          return 0;
        }
      }

      function saveBest() {
        try {
          localStorage.setItem(STORAGE_KEY, String(best));
        } catch (error) {
          // Storage can be unavailable in private or restricted browser contexts.
        }
      }

      function formatNumber(value) {
        return String(value).padStart(4, "0");
      }

      function setStatus(nextState) {
        statusEl.classList.toggle("is-paused", nextState === "paused");
        statusEl.classList.toggle("is-over", nextState === "over");
        statusTextEl.textContent = nextState === "running" ? "running" : nextState === "paused" ? "paused" : "signal lost";
        pauseBtn.textContent = nextState === "paused" ? "▶" : "Ⅱ";
        pauseBtn.setAttribute("aria-label", nextState === "paused" ? "继续游戏" : "暂停游戏");
      }

      function updateHud() {
        scoreEl.textContent = formatNumber(score);
        bestEl.textContent = formatNumber(best);
        levelEl.textContent = String(level).padStart(2, "0");
      }

      function showOverlay(mode) {
        if (mode === "paused") {
          overlayKickerEl.textContent = "system hold";
          overlayTitleEl.textContent = "已暂停";
          overlayScoreEl.textContent = `当前得分 ${score}`;
          overlayActionEl.innerHTML = '<span aria-hidden="true">▶</span><span>继续游戏</span>';
        } else if (mode === "over") {
          overlayKickerEl.textContent = "signal lost";
          overlayTitleEl.textContent = "游戏结束";
          overlayScoreEl.textContent = `本局得分 ${score}`;
          overlayActionEl.innerHTML = '<span aria-hidden="true">↻</span><span>重新开始</span>';
        }
        overlayEl.classList.add("is-visible");
      }

      function hideOverlay() {
        overlayEl.classList.remove("is-visible");
      }

      function getRandomFood() {
        const openCells = [];
        for (let y = 0; y < GRID; y += 1) {
          for (let x = 0; x < GRID; x += 1) {
            if (!snake.some((segment) => segment.x === x && segment.y === y)) {
              openCells.push({ x, y });
            }
          }
        }
        return openCells.length ? openCells[Math.floor(Math.random() * openCells.length)] : null;
      }

      function resetGame() {
        const center = Math.floor(GRID / 2);
        snake = Array.from({ length: START_LENGTH }, (_, index) => ({ x: center - index, y: center }));
        direction = { ...DIRECTIONS.right };
        queuedDirection = { ...DIRECTIONS.right };
        score = 0;
        level = 1;
        state = "running";
        food = getRandomFood();
        hideOverlay();
        setStatus(state);
        updateHud();
        restartTimer();
        draw();
      }

      function speedForLevel() {
        return Math.max(62, 148 - (level - 1) * 8);
      }

      function restartTimer() {
        if (timerId) {
          window.clearInterval(timerId);
        }
        timerId = window.setInterval(step, speedForLevel());
      }

      function setDirection(nextDirection) {
        const next = DIRECTIONS[nextDirection];
        if (!next || state === "over") {
          return;
        }
        if (next.x === -direction.x && next.y === -direction.y) {
          return;
        }
        queuedDirection = { ...next };
        if (state === "paused") {
          togglePause();
        }
      }

      function step() {
        if (state !== "running") {
          return;
        }

        direction = { ...queuedDirection };
        const head = snake[0];
        const nextHead = { x: head.x + direction.x, y: head.y + direction.y };
        const hitsWall = nextHead.x < 0 || nextHead.x >= GRID || nextHead.y < 0 || nextHead.y >= GRID;
        const eatsFood = food && nextHead.x === food.x && nextHead.y === food.y;
        const bodyToCheck = eatsFood ? snake : snake.slice(0, -1);
        const hitsSelf = bodyToCheck.some((segment) => segment.x === nextHead.x && segment.y === nextHead.y);

        if (hitsWall || hitsSelf) {
          endGame();
          return;
        }

        snake.unshift(nextHead);
        if (eatsFood) {
          score += SCORE_STEP;
          best = Math.max(best, score);
          level = Math.floor(score / 50) + 1;
          food = getRandomFood();
          saveBest();
          updateHud();
          restartTimer();
        } else {
          snake.pop();
        }

        draw();
      }

      function endGame() {
        state = "over";
        setStatus(state);
        showOverlay(state);
        if (timerId) {
          window.clearInterval(timerId);
          timerId = null;
        }
        draw();
      }

      function togglePause() {
        if (state === "over") {
          return;
        }
        if (state === "paused") {
          state = "running";
          hideOverlay();
          setStatus(state);
          restartTimer();
        } else {
          state = "paused";
          if (timerId) {
            window.clearInterval(timerId);
            timerId = null;
          }
          setStatus(state);
          showOverlay(state);
        }
        draw();
      }

      function resizeCanvas() {
        const rect = boardWrap.getBoundingClientRect();
        boardSize = Math.floor(rect.width);
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cellSize = boardSize / GRID;
        canvas.width = Math.max(1, Math.floor(boardSize * dpr));
        canvas.height = Math.max(1, Math.floor(boardSize * dpr));
        canvas.style.width = `${boardSize}px`;
        canvas.style.height = `${boardSize}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }

      function roundedRect(context, x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        context.beginPath();
        context.moveTo(x + r, y);
        context.arcTo(x + width, y, x + width, y + height, r);
        context.arcTo(x + width, y + height, x, y + height, r);
        context.arcTo(x, y + height, x, y, r);
        context.arcTo(x, y, x + width, y, r);
        context.closePath();
      }

      function drawGrid() {
        ctx.fillStyle = "#0c1112";
        ctx.fillRect(0, 0, boardSize, boardSize);

        ctx.strokeStyle = "rgba(132, 160, 157, 0.095)";
        ctx.lineWidth = 1;
        for (let index = 1; index < GRID; index += 1) {
          const position = Math.round(index * cellSize) + 0.5;
          ctx.beginPath();
          ctx.moveTo(position, 0);
          ctx.lineTo(position, boardSize);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, position);
          ctx.lineTo(boardSize, position);
          ctx.stroke();
        }

        ctx.strokeStyle = "rgba(156, 242, 197, 0.35)";
        ctx.lineWidth = 1;
        ctx.strokeRect(0.5, 0.5, boardSize - 1, boardSize - 1);
      }

      function drawFood() {
        if (!food) {
          return;
        }
        const centerX = (food.x + 0.5) * cellSize;
        const centerY = (food.y + 0.5) * cellSize;
        const radius = Math.max(3, cellSize * 0.2);
        ctx.save();
        ctx.shadowColor = "rgba(255, 142, 114, 0.82)";
        ctx.shadowBlur = cellSize * 0.9;
        ctx.fillStyle = "#ff8e72";
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = "#ffd4c9";
        ctx.beginPath();
        ctx.arc(centerX - radius * 0.35, centerY - radius * 0.35, Math.max(1, radius * 0.25), 0, Math.PI * 2);
        ctx.fill();
      }

      function drawSnake() {
        snake.slice().reverse().forEach((segment, reverseIndex) => {
          const index = snake.length - reverseIndex - 1;
          const inset = Math.max(2, cellSize * 0.12);
          const x = segment.x * cellSize + inset;
          const y = segment.y * cellSize + inset;
          const size = cellSize - inset * 2;
          const isHead = index === 0;
          const isTail = index === snake.length - 1;
          ctx.save();
          roundedRect(ctx, x, y, size, size, Math.max(3, cellSize * 0.18));
          ctx.fillStyle = isHead ? "#9cf2c5" : isTail ? "#2cbd7c" : "#53dda0";
          ctx.shadowColor = isHead ? "rgba(156, 242, 197, 0.42)" : "transparent";
          ctx.shadowBlur = isHead ? cellSize * 0.75 : 0;
          ctx.fill();
          ctx.restore();

          if (isHead) {
            const eyeRadius = Math.max(1.3, cellSize * 0.07);
            const front = cellSize * 0.24;
            const side = cellSize * 0.22;
            const centerX = segment.x * cellSize + cellSize / 2;
            const centerY = segment.y * cellSize + cellSize / 2;
            const eyePositions = direction.x !== 0
              ? [
                  { x: centerX + direction.x * front, y: centerY - side },
                  { x: centerX + direction.x * front, y: centerY + side }
                ]
              : [
                  { x: centerX - side, y: centerY + direction.y * front },
                  { x: centerX + side, y: centerY + direction.y * front }
                ];
            ctx.fillStyle = "#0c1112";
            eyePositions.forEach((eye) => {
              ctx.beginPath();
              ctx.arc(eye.x, eye.y, eyeRadius, 0, Math.PI * 2);
              ctx.fill();
            });
          }
        });
      }

      function draw() {
        if (!boardSize) {
          return;
        }
        drawGrid();
        drawFood();
        drawSnake();
      }

      function onKeyDown(event) {
        const key = event.key.toLowerCase();
        const directionKeys = {
          arrowup: "up",
          w: "up",
          arrowdown: "down",
          s: "down",
          arrowleft: "left",
          a: "left",
          arrowright: "right",
          d: "right"
        };
        if (directionKeys[key]) {
          event.preventDefault();
          setDirection(directionKeys[key]);
          return;
        }
        if (key === " ") {
          event.preventDefault();
          togglePause();
          return;
        }
        if (key === "enter" && state === "over") {
          resetGame();
        }
      }

      function onTouchStart(event) {
        const touch = event.changedTouches[0];
        touchStart = { x: touch.clientX, y: touch.clientY };
      }

      function onTouchEnd(event) {
        if (!touchStart) {
          return;
        }
        const touch = event.changedTouches[0];
        const dx = touch.clientX - touchStart.x;
        const dy = touch.clientY - touchStart.y;
        touchStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) {
          return;
        }
        if (Math.abs(dx) > Math.abs(dy)) {
          setDirection(dx > 0 ? "right" : "left");
        } else {
          setDirection(dy > 0 ? "down" : "up");
        }
      }

      document.addEventListener("keydown", onKeyDown);
      boardWrap.addEventListener("touchstart", onTouchStart, { passive: true });
      boardWrap.addEventListener("touchend", onTouchEnd, { passive: true });
      window.addEventListener("resize", resizeCanvas);
      pauseBtn.addEventListener("click", togglePause);
      restartBtn.addEventListener("click", resetGame);
      overlayActionEl.addEventListener("click", () => {
        if (state === "paused") {
          togglePause();
        } else {
          resetGame();
        }
      });
      document.querySelectorAll("[data-dir]").forEach((button) => {
        button.addEventListener("click", () => setDirection(button.dataset.dir));
      });

      bestEl.textContent = formatNumber(best);
      resizeCanvas();
      resetGame();
    })();
  </script>
</body>
</html>
